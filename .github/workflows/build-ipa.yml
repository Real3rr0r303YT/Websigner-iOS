# Builds, signs and publishes WebSigner.ipa, then regenerates manifest.plist.
#
# Run it from Actions -> "Build IPA" -> Run workflow (enter a tag like v1.2.0),
# or by pushing a tag that starts with "v".
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   BUILD_CERTIFICATE_BASE64        base64 of your distribution certificate (.p12)
#   P12_PASSWORD                    password of that .p12
#   BUILD_PROVISION_PROFILE_BASE64  base64 of an Ad Hoc, Development or Enterprise
#                                   .mobileprovision (App Store profiles can't be
#                                   installed over the air)
name: Build IPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          missing=""
          [ -n "$CERT" ] || missing="$missing BUILD_CERTIFICATE_BASE64"
          [ -n "$PROFILE" ] || missing="$missing BUILD_PROVISION_PROFILE_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing P12_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README -> Building the IPA."
            exit 1
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag must look like v1.2.0 (got '$TAG')"; exit 1 ;;
          esac

      - name: Install certificate and provisioning profile
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046 # split on purpose: one argument per existing keychain
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 && $2 ~ /^[0-9A-F]{40}$/ {print $2}')
          [ -n "$IDENTITY" ] || { echo "::error::No valid signing identity in the .p12"; exit 1; }

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true; }
          UUID=$(pb UUID)
          TEAM_ID=$(pb TeamIdentifier:0)
          APP_ID=$(pb Entitlements:application-identifier)
          BUNDLE_ID="${APP_ID#"$TEAM_ID".}"
          if [ "$(pb ProvisionsAllDevices)" = "true" ]; then
            METHOD=enterprise
          elif [ "$(pb Entitlements:get-task-allow)" = "true" ]; then
            METHOD=development
          elif [ -n "$(pb ProvisionedDevices:0)" ]; then
            METHOD=ad-hoc
          else
            echo "::error::App Store profiles can't be installed over the air. Use an Ad Hoc, Development or Enterprise profile."
            exit 1
          fi
          # Wildcard profiles (TEAMID.*) don't pin a bundle ID: use the project's.
          case "$BUNDLE_ID" in *"*"*) BUNDLE_ID="com.real3rr0r303yt.websigner" ;; esac

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$UUID.mobileprovision"
          done

          echo "Profile '$(pb Name)' ($METHOD), team $TEAM_ID, bundle ID $BUNDLE_ID"
          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "IDENTITY=$IDENTITY"
            echo "PROFILE_UUID=$UUID"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "EXPORT_METHOD=$METHOD"
          } >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd app && xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project app/WebSigner.xcodeproj \
            -scheme WebSigner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WebSigner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WebSigner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mkdir -p dist
          mv "$RUNNER_TEMP"/export/*.ipa dist/WebSigner.ipa

      - name: Validate IPA
        run: python3 tools/check_ipa.py dist/WebSigner.ipa

      - name: Publish to GitHub Release
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "WebSigner $TAG" \
              --notes "Install from https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/ in Safari on iOS."
          fi
          gh release upload "$TAG" dist/WebSigner.ipa --clobber

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  manifest:
    needs: build
    uses: ./.github/workflows/ota-release.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
